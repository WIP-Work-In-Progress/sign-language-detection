name: Deploy

on:
  push:
    branches:
      - prod

permissions:
  contents: read
  packages: write

env:
  IMAGE_BACKEND: sign-language-detection/miganie-backend
  IMAGE_FRONTEND: sign-language-detection/miganie-frontend

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push backend
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile.backend
          push: true
          tags: |
            ghcr.io/${{ env.IMAGE_BACKEND }}:${{ github.sha }}
            ghcr.io/${{ env.IMAGE_BACKEND }}:latest

      - name: Build and push frontend
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile.frontend
          push: true
          build-args: |
            VITE_API_BASE=${{ secrets.VITE_API_BASE }}
          tags: |
            ghcr.io/${{ env.IMAGE_FRONTEND }}:${{ github.sha }}
            ghcr.io/${{ env.IMAGE_FRONTEND }}:latest
